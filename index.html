<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- 1. サイトのタイトル（ブラウザのタブや検索結果の最も大きな文字になります） -->
        <title>SIXIMA | Dual-Paradigm Interface Architecture</title>

        <!-- 2. ディスクリプション（検索結果の下に出る説明文。理念を日・英で直球で書きます） -->
        <meta
            name="description"
            content="SIXIMA is a research initiative from JAIST building AI-friendly, dual-paradigm interfaces to literally leave no one behind. / SIXIMAは「誰一人取り残さない」社会を実現するため、健常者と障害者の分断をなくし、AIによる動的適応を可能にする新しいインターフェース基盤を構築する研究プロジェクトです。"
        />

        <!-- 3. キーワード（AIクローラー向け。サイトの主題となる単語を列挙します） -->
        <meta
            name="keywords"
            content="SIXIMA, JAIST, Accessibility, AI-Friendly, Dual-Paradigm, UI/UX, ユニバーサルデザイン, アクセシビリティ, 誰一人取り残さない, 人工知能"
        />

        <!-- 4. クローラーに対するインデックス（検索登録）の許可 -->
        <meta name="robots" content="index, follow" />
        <meta name="googlebot" content="index, follow" />

        <!-- 5. OGP（X/Twitter、Discord、Facebook等でURLがシェアされた時に表示されるカード情報） -->
        <meta property="og:type" content="website" />
        <meta
            property="og:title"
            content="SIXIMA | Dual-Paradigm Interface Architecture"
        />
        <meta
            property="og:description"
            content="Literally leave no one behind. AI-driven dynamic adaptation architecture. / 健常者と障害者の分断をなくし、AIによる動的適応で誰一人取り残さないデジタル基盤を。"
        />
        <meta property="og:url" content="https://your-sixima-url.com/" />
        <!-- ※本番のURLに書き換えてください -->
        <meta
            property="og:image"
            content="https://your-sixima-url.com/og-image.png"
        />
        <!-- ※サムネイル画像のURLに書き換えてください -->

        <!-- 6. X (Twitter) 向けの表示設定 -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="SIXIMA | Dual-Paradigm Interface Architecture"
        />
        <meta
            name="twitter:description"
            content="Literally leave no one behind. AI-driven dynamic adaptation architecture."
        />
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
